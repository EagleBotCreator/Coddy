name: Android APK and checks
on:
  push:
    paths: ['android/**', 'scripts/generate_design_tokens.py', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'scripts/generate_design_tokens.py', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Verify generated design tokens
        run: python3 scripts/generate_design_tokens.py --check
      - name: Test and build Android
        run: |
          chmod +x android/gradlew
          android/gradlew -p android :core:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Coddy-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-check-reports
          path: |
            android/core/build/reports/tests
            android/app/build/reports/lint-results-debug.html

  transfer:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test offline Android transfer
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_android_transfer.py -v
